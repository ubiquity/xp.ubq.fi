name = "xp-ubq-fi"
main = "worker/entry.ts"
compatibility_date = "2024-10-01"
account_id = "5c0228bee348f4cf48829ffe21b61fe9"

# Static viewer assets assembled by tools/build-assets.ts (index.html, src/**,
# dist/**, optional fixtures). Unmatched paths fall through to the worker,
# which serves /api/* like the previous Deno Deploy proxy.
[assets]
directory = ".cf-assets"
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true
head_sampling_rate = 1
